[project]
name = "netsentinel"
version = "0.1.0"
description = "ML layer that flags what signature IDS misses - explained, prioritised SOC incidents, never auto-block."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "numpy>=1.26", "pandas>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nscore*"]

[tool.setuptools.package-data]
"nscore.contracts" = ["*.json", "fixtures/*.json", "baselines/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"ml/data/make_profile_doc.py" = ["E501"]  # report prose + table rows
"ml/train/*.py" = ["E501"]  # experiment scripts: docstrings and result-printing lines
"api/app/services/brief.py" = ["E501"]  # LLM system prompt text: wrapping would change the prompt
"api/app/services/brief_eval.py" = ["E501"]  # evaluation report lines
"replay/replay.py" = ["E501"]  # console output lines
"api/tests/test_brief.py" = ["E501"]  # expected prompt / brief strings

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = ["."]  # `pytest` (not just `python -m pytest`) must see the ml/ package
