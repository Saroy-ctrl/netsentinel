name: ci
on:
  pull_request:
  push:
    branches: [main]

# gitleaks lists the PR's commits via the API; the default token has no pull-requests scope (403 on PRs)
permissions:
  contents: read
  pull-requests: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r requirements-api.txt
      - run: ruff check .
      - name: fixtures are up to date with contracts
        run: |
          python -m nscore.contracts.fixtures.make_fixtures
          git diff --exit-code nscore/contracts/fixtures/
      - run: pytest -q   # tests/ and api/tests/ (see pyproject testpaths)

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
