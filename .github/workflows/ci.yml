name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/m3-backend-platform
  pull_request:
    branches:
      - main
      - feature/m3-backend-platform
  workflow_dispatch:

jobs:
  test:
    name: Run Linting and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-dashboard.txt pytest ruff
          
      - name: Run Ruff Linter
        run: |
          ruff check .
          
      - name: Run Pytest
        run: |
          pytest api/tests/

  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          
      - name: Build and Push API Image
        run: |
          docker build -f Dockerfile.api -t ${{ secrets.ACR_NAME }}.azurecr.io/netsentinel-api:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/netsentinel-api:${{ github.sha }}
          
      - name: Build and Push Dashboard Image
        run: |
          docker build -f Dockerfile.dashboard -t ${{ secrets.ACR_NAME }}.azurecr.io/netsentinel-dashboard:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/netsentinel-dashboard:${{ github.sha }}
          
      - name: Deploy API to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RG }}
          containerAppName: netsentinel-api
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/netsentinel-api:${{ github.sha }}
          
      - name: Deploy Dashboard to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RG }}
          containerAppName: netsentinel-dashboard
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/netsentinel-dashboard:${{ github.sha }}
